server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-résout `api` (évite 502 après recreate API)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        # Même stack Express : JSON + CORS (le stub nginx « ok » n’avait pas ACAO).
        set $gasoil_api_upstream "http://api:4000";
        proxy_pass $gasoil_api_upstream/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
    }

    location /api/ {
        # Avec variable, URI complète via $request_uri (sinon 404)
        set $gasoil_api_upstream "http://api:4000";
        proxy_pass $gasoil_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 120m;
    }

    location /get-app {
        set $gasoil_api_upstream "http://api:4000";
        proxy_pass $gasoil_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /download {
        try_files /download.html =404;
    }

    # App indépendante : APK Android, pas le SPA Expo (« Fuel »).
    location = /install {
        add_header Cache-Control "no-store" always;
        try_files /install.html =404;
    }
    location = /install.html {
        add_header Cache-Control "no-store" always;
        try_files /install.html =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files /manifest.webmanifest =404;
    }

    location = /icon.png {
        try_files /icon.png /apple-touch-icon.png =404;
    }

    location = / {
        default_type text/html;
        root /usr/share/nginx/html;
        try_files /hubera-landing.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /app {
        return 302 /app/;
    }
    location /app/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
