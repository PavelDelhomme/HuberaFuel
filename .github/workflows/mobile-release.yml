name: Mobile APK release

# Build APK sur le runner GitHub (eas --local) + upload API prod à chaque push sur prod.
# --local : ne consomme PAS le quota EAS cloud (Free plan saturé jusqu’au 1er du mois).
# Secrets GitHub requis : EXPO_TOKEN, RELEASE_UPLOAD_TOKEN

on:
  push:
    branches: [prod]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'context/**'
      - 'hooks/**'
      - 'constants/**'
      - 'plugins/**'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version APK (ex: 1.4.53)'
        required: false
        default: ''

concurrency:
  group: mobile-apk-prod
  cancel-in-progress: true

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(node -p "require('./app.json').expo.version")
          fi
          VC=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"

      - name: Stamp versionCode local (évite EAS remote = downgrade Android)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const vc = app.expo.android.versionCode;
          const vn = app.expo.version;
          eas.cli = eas.cli || {};
          eas.cli.appVersionSource = 'local';
          eas.build.production.android.gradleCommand =
            `:app:assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.injected.version.code=${vc} -Pandroid.injected.version.name=${vn}`;
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          console.log('gradleCommand', eas.build.production.android.gradleCommand);
          NODE

      - name: Announce build pending (API)
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsS -X POST "https://gasoil-tracking.delhomme.ovh/api/ci/releases/pending" \
            -H "X-Release-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\",\"releaseNotes\":\"Mise à jour en préparation\",\"sha\":\"$GITHUB_SHA\"}" \
            || echo "Annonce pending échouée — on continue"

      - name: Build Android APK (EAS local, arm64, sans quota cloud)
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_BUILD: 'true'
          CI: 'true'
          ORG_GRADLE_PROJECT_reactNativeArchitectures: 'arm64-v8a'
        run: |
          eas build --platform android --profile production \
            --non-interactive --local --output /tmp/gasoil.apk
          ls -lh /tmp/gasoil.apk
          test -s /tmp/gasoil.apk || { echo "Pas d'APK produit"; exit 1; }
          SIZE=$(wc -c < /tmp/gasoil.apk)
          if [ "$SIZE" -gt 80000000 ]; then
            echo "APK trop gros ($SIZE) — probablement multi-ABI, refusé"
            exit 1
          fi

      - name: Verify APK (versionCode réel, ABI, certificat)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: |
          pip install -q pyaxmlparser
          PKG=$(node -p "require('./app.json').expo.android.package")
          NAME=$(node -p "require('./app.json').expo.name")
          python3 scripts/verify-release-apk.py /tmp/gasoil.apk \
            --package "$PKG" \
            --package com.gasoiltracking.app \
            --host fuel.hubera.cloud \
            --app-name "$NAME" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION"

      - name: Upload to Gasoil API (prod)
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: |
          set -euo pipefail
          LIVE=$(curl -fsS "https://gasoil-tracking.delhomme.ovh/api/version" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version||''")
          node -e "
            const live=process.argv[1], v=process.argv[2];
            const cmp=(a,b)=>{const pa=String(a||'0').split('.').map(x=>parseInt(x,10)||0);const pb=String(b||'0').split('.').map(x=>parseInt(x,10)||0);for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d) return d;}return 0;};
            if (live && cmp(v, live) < 0) { console.log('Skip upload: '+v+' < live '+live); process.exit(42); }
          " "$LIVE" "$VERSION" || { echo "Skip older build"; exit 0; }
          PKG=$(node -p "require('./app.json').expo.android.package")
          HTTP=$(curl -sS -o /tmp/rel.json -w "%{http_code}" -X POST "https://gasoil-tracking.delhomme.ovh/api/ci/releases" \
            -H "X-Release-Token: $TOKEN" \
            -F "version=$VERSION" \
            -F "versionCode=$VERSION_CODE" \
            -F "packageName=$PKG" \
            -F "forceUpdate=1" \
            -F "releaseNotes=v$VERSION — suivi live Maps (HUD vitesse/limite/km) · historique par date/plage · OTA force." \
            -F "apk=@/tmp/gasoil.apk")
          cat /tmp/rel.json
          echo
          echo "HTTP $HTTP"
          test "$HTTP" = "201" || exit 1
          echo "APK $VERSION vc$VERSION_CODE publié"
          curl -sf "https://gasoil-tracking.delhomme.ovh/api/version" || true
          echo
