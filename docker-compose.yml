# Hubera Fuel — production Portainer (branche prod)
# Domaine: https://gasoil-tracking.delhomme.ovh
# Stack Git: Repository → docker-compose.yml → refs/heads/prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gasoil-tracking-web:1.4.154
    container_name: gasoil-tracking-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gasoil-network
      - web
    labels:
      - "com.gasoiltracking.project=gasoil-tracking"
      - "com.gasoiltracking.service=web"
      - "com.gasoiltracking.version=1.4.154"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: gasoil-tracking-api:1.4.154
    container_name: gasoil-tracking-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: "4000"
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-gasoil-tracking-prod}
      PUBLIC_URL: ${PUBLIC_URL:-https://fuel.hubera.cloud}
      APP_VERSION: ${APP_VERSION:-1.4.154}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-1.0.0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@delhomme.ovh}
      PERSONAL_MAIL: ${PERSONAL_MAIL:-}
      INVITE_CODE: ${INVITE_CODE}
      RELEASE_UPLOAD_TOKEN: ${RELEASE_UPLOAD_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-0}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Hubera Fuel <noreply@maily.ovh>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      APP_SCHEME: gasoiltracking
      TRUST_PROXY: "1"
    volumes:
      - gasoil_api_data:/data
    networks:
      - gasoil-network
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "com.gasoiltracking.project=gasoil-tracking"
      - "com.gasoiltracking.service=api"

networks:
  gasoil-network:
    external: true
    name: gasoil-network
  web:
    external: true
    name: web

volumes:
  gasoil_api_data:
    name: gasoil_api_data
